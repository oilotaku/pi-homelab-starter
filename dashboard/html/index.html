<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jason-Pi 服務導覽</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="brand">🖥️ Jason-Pi</div>
      <a class="navlink active" href="index.html">🏠 首頁</a>
      <a class="navlink" href="health.html">💚 裝置健康</a>
      <a class="navlink" href="devices.html">📶 區網裝置</a>
      <div class="navfoot" id="hostLine">連線中…</div>
    </nav>

    <main class="main">
      <div class="page-header">
        <h1>Jason-Pi 服務導覽</h1>
        <p class="subtitle">媒體伺服器與下載自動化控制台</p>
      </div>

      <div class="group">
        <a class="health-strip card-surface" href="health.html" id="healthStrip">
          <div class="hs-item">
            <span class="hs-label">主機溫度</span>
            <span class="hs-value" id="hsTemp">-</span>
          </div>
          <div class="hs-item">
            <span class="hs-label">磁碟健康</span>
            <span class="badge unknown" id="hsSmart">讀取中</span>
          </div>
          <div class="hs-item">
            <span class="hs-label">Docker 容器</span>
            <span class="badge unknown" id="hsDocker">讀取中</span>
          </div>
          <div class="hs-item">
            <span class="hs-label">區網裝置</span>
            <span class="hs-value" id="hsLan">-</span>
          </div>
          <span class="hs-more">查看詳情 →</span>
        </a>
      </div>

      <div class="group" id="rssGroup" hidden>
        <h2>新增追番(自動 RSS 下載)</h2>
        <div class="rss-card card-surface">
          <div class="rss-form">
            <input type="text" id="rssKeyword" placeholder="輸入劇名關鍵字,例如:葬送的芙莉蓮" maxlength="60">
            <button id="rssSubmit">建立並開始下載</button>
          </div>
          <div class="rss-hint">送出後會呼叫 <code>config.js</code> 設定的 RSS 自動下載後端(<code>POST /api/create</code>,body 為 <code>{"keyword"}</code>),實際搜尋/下載規則由那支後端決定——這個表單本身不含任何下載邏輯。</div>
          <div class="rss-result" id="rssResult"></div>
        </div>
      </div>

      <div id="serviceGroups"></div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="index.js"></script>
</body>
</html>
