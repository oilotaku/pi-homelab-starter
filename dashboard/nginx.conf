# dashboard 容器(nginx:alpine)用的自訂設定,取代預設 /etc/nginx/conf.d/default.conf。
#
# 為什麼需要這個檔案:預設設定完全沒有送出 Cache-Control,瀏覽器(尤其實測踩到的
# iOS Safari)在沒有明確快取指示時,可能直接用啟發式快取(heuristic caching)長時間
# 完全不打伺服器就把舊頁面吃出來——連「關閉分頁重開」都繞不過,因為根本沒發出網路
# 請求,不是單純的瀏覽器快取/bfcache 問題。踩坑經過:2026-09-10 重構部署後,iPhone
# Safari 持續顯示重構前(甚至 Jellyfin 移除前)的舊畫面,nginx access log 完全沒有
# 該裝置的任何請求紀錄,才發現是這個根因。
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # index.html / config.js / *.json 都可能常常變動(重新部署、cron 更新資料),
    # 一律要求瀏覽器每次重新驗證,不給啟發式快取有機可趁。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /config.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.json$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Vite build 產物檔名帶 content hash,內容不變檔名就不變,可以放心長期快取。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
