services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - FTLCONF_webserver_api_password=${PIHOLE_WEBPASSWORD:?請先在 .env 設定 PIHOLE_WEBPASSWORD 為一組強密碼}
      - FTLCONF_dns_upstreams=${PIHOLE_DNS_UPSTREAM:-8.8.8.8;1.1.1.1}
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
    cap_add:
      - NET_ADMIN
